# Always-on deployment. Deploy: `git pull && docker compose up -d --build`.
# Rollback: set JO_WATCHDOG_TAG to the previous tag and `docker compose up -d`
# (see "Rollback" in the README).
services:
  watchdog:
    build: .
    image: jo-watchdog:${JO_WATCHDOG_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data            # host dir 0700, ledger 0600, owned by uid 1000
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-m", "jo_watchdog.app", "healthcheck", "--config", "/app/config.yaml"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
