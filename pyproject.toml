[project]
name = "jo-watchdog"
version = "0.1.0"
description = "JO Telegram Watchdog: durable Telegram-to-Notion Job Order capture"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jo_watchdog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
