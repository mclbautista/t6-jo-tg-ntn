# Non-secret configuration. Copy to config.yaml and fill in the real values.
# Secrets (Telegram bot token, Notion integration token) go in .env, never here.

# --- Telegram scope filter (build-time values, supplied by the owner) ---
intake_chat_id: -1000000000000      # the intake supergroup's chat id
intake_topic_id: 0                  # the intake forum topic's message_thread_id
captured_reaction: "✅"             # emoji picked from the real group's reactions

# --- Polling ---
poll_timeout: 50                    # Telegram long-poll timeout (seconds, max 50)
poll_interval: 1.0                  # pause between poll+drain cycles (seconds)

# --- Notion ---
job_orders_data_source_id: "3d8fb4d5-9e59-8073-a0d0-000b77632947"
notion_version: "2026-03-11"        # pinned API version (do not change casually)

# --- Live resolution caches (People, Projects, Department options) ---
contacts_data_source_id: "77b2a701-71db-4e88-a694-37f07303e77e"
projects_data_source_id: "cc1dc02a-8f32-4c97-81e4-dc1e08d7f134"
leizette_contact_page_id: "3d8fb4d5-9e59-8035-acbf-f9b01f1430cd"  # standing cc on every JO
cache_refresh_hours: 6              # refresh at startup and on this interval
cache_stale_alert_hours: 24         # ops finding once a failed refresh leaves a cache this old
fuzzy_min_score: 90                 # rapidfuzz WRatio needed for a name-only match
fuzzy_min_lead: 8                   # lead over the runner-up contact
department_aliases:                 # header token -> Department option (then live validation)
  TO: TOC
honorifics: [ate, kuya, sir]        # dropped from mentions and Aliases before matching

# --- Ledger ---
ledger_path: "./data/ledger.db"
